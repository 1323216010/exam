<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习原题</title>
  <style>
    :root { --ink:#17382f; --muted:#62776f; --line:#dbe6df; --green:#12684e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#eef6f1; color:var(--ink); }
    .top { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); }
    .top-inner { max-width:880px; margin:auto; padding:14px 20px; display:flex; justify-content:space-between; gap:16px; align-items:center; }
    h1 { margin:0; font-size:20px; }
    .meta { color:var(--muted); font-size:13px; margin-top:4px; }
    .btn { display:inline-flex; align-items:center; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:7px 12px; text-decoration:none; font-size:13px; }
    .wrap { max-width:880px; margin:auto; padding:20px 20px 48px; }
    .item { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin:0 0 14px; }
    .item.current { border-color:var(--green); box-shadow:0 0 0 3px #12684e22; }
    .kind { color:var(--muted); font-size:13px; margin-bottom:8px; }
    .stem { font-size:18px; line-height:1.6; margin:0 0 10px; }
    .opts { margin:0; padding-left:22px; }
    .opts li { margin:4px 0; }
    .ans { margin:12px 0 0; color:var(--muted); font-size:14px; }
    .notice { padding:24px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-inner">
      <div>
        <h1 id="title">练习原题</h1>
        <div class="meta" id="meta">本地题库转载，不是历年真题试卷页</div>
      </div>
      <a class="btn" href="./">返回考点学习</a>
    </div>
  </div>
  <div class="wrap" id="list"><div class="notice">正在加载…</div></div>
  <script>
    const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    const params = new URLSearchParams(location.search);
    const file = params.get("file") || "";
    const qid = params.get("q") || "";
    function safeFile(path) {
      if (!path || path.includes("..") || !path.startsWith("json/")) return "";
      return path;
    }
    async function main() {
      const path = safeFile(file);
      if (!path) throw new Error("缺少有效的练习文件");
      const res = await fetch(path);
      if (!res.ok) throw new Error("无法加载练习");
      const data = await res.json();
      const info = data.exam_info || {};
      const questions = data.questions || [];
      document.title = info.title || "练习原题";
      document.getElementById("title").textContent = info.title || "练习原题";
      document.getElementById("meta").textContent = [info.subject, info.code, info.kind || "练习"].filter(Boolean).join(" · ") + " · 不是历年真题试卷页";
      document.getElementById("list").innerHTML = questions.map(q => {
        const num = String(q.question_number || "");
        const opts = q.options ? `<ol class="opts" type="A">${Object.values(q.options).map(v => `<li>${esc(v)}</li>`).join("")}</ol>` : "";
        const ans = q.answer ? `<p class="ans">参考答案：${esc(q.answer)}${q.analysis ? "。 " + esc(q.analysis) : ""}</p>` : "";
        return `<article class="item${qid && num === qid ? " current" : ""}" id="q-${esc(num)}"><div class="kind">${esc(q.question_type || "题目")} · 第 ${esc(num)} 题</div><p class="stem">${esc(q.content || "")}</p>${opts}${ans}</article>`;
      }).join("") || `<div class="notice">这份练习没有题目。</div>`;
      if (qid) {
        const target = document.getElementById("q-" + qid);
        if (target) target.scrollIntoView({ block: "start" });
      }
    }
    main().catch(err => {
      document.getElementById("list").innerHTML = `<div class="notice">${esc(err.message)}</div>`;
    });
  </script>
</body>
</html>
