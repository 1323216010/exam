<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自测系统 - 答题</title>
    <!-- Vditor for Markdown rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.7/dist/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vditor@3.10.7/dist/index.min.js"></script>
    <link rel="stylesheet" href="css/common.css?v=20260823">
    <link rel="stylesheet" href="css/exam.css?v=20260823c">
    <link rel="stylesheet" href="css/ai-chat.css?v=20260823">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <div class="sidebar hidden" id="sidebar">
            <div class="sidebar-header">
                <h2 id="exam-header-title">自测系统</h2>
                <div class="exam-name" id="exam-header-name"></div>
            </div>

            <div class="question-nav" id="question-nav">
                <!-- 题目导航将在这里动态生成 -->
            </div>

            <div class="sidebar-footer">
                <div class="progress-info">
                    <span>已答 <strong id="answered-count">0</strong> / <span id="total-count">0</span></span>
                    <span id="time-display">00:00</span>
                </div>
                <button class="btn btn-submit" id="submit-btn">提交答卷</button>
                <button class="btn btn-secondary" id="restart-btn" style="display: none;">重新开始</button>
                <div class="sidebar-footer-actions">
                    <button class="btn btn-text" id="clear-ai-chats-btn" title="清空所有题目的 AI 聊天记录">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        清空聊天记录
                    </button>
                    <button class="btn btn-text" id="reset-sidebar-width-btn" title="重置侧边栏为默认宽度">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        重置宽度
                    </button>
                </div>
            </div>
        </div>

        <!-- 侧边栏调节边：拖拽调节宽度 / 折叠展开 -->
        <div class="sidebar-edge hidden" id="sidebarEdge">
            <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="折叠/展开侧边栏">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 移动端汉堡菜单按钮 -->
            <button class="mobile-menu-btn" id="mobile-menu-btn" style="display: none;">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- 加载提示 -->
            <div id="exam-loading" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #6B7280; gap: 16px; font-size: 16px;">
                <div style="font-size: 48px; display:flex; align-items:center; justify-content:center; color:#9CA3AF;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                </div>
                <div>正在加载试题...</div>
            </div>

            <!-- 答题布局：包含答题界面和 AI 面板 -->
            <div class="exam-layout hidden" id="exam-layout">
                <!-- 答题界面 -->
                <div id="exam-interface" class="exam-section">
                    <div class="question-container" id="question-container">
                        <!-- 题目内容 -->
                    </div>
                </div>

                <!-- AI 面板折叠边 -->
                <div class="ai-panel-edge" id="aiPanelEdge">
                    <div class="layout-resizer" id="layoutResizer" title="拖动调节面板宽度"></div>
                    <button class="ai-panel-toggle-btn" id="aiPanelToggleBtn" title="折叠/展开 AI 面板">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                </div>

                <!-- AI 聊天侧边栏 -->
                <aside class="ai-chat-panel collapsed" id="aiChatPanel">
                    <div class="ai-chat-header">
                        <div class="ai-chat-title">
                            <span class="ai-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
                            </span>
                            <h3>AI 解析助手 <span class="ai-subtitle" id="aiSubtitle">· 未选中题目</span></h3>
                        </div>
                        <button class="btn-icon" id="closeAiPanel" title="关闭面板">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="ai-chat-messages" id="aiChatMessages">
                        <!-- 聊天消息将在这里动态生成 -->
                    </div>
                    
                    <div class="ai-chat-input-area">
                        <div id="aiImagePreviewContainer" class="ai-image-preview-container" style="display: none;"></div>
                        <div class="ai-input-box">
                            <textarea 
                                id="aiChatInput" 
                                class="ai-chat-input" 
                                placeholder="继续提问..."
                                rows="1"></textarea>
                            <div class="ai-input-footer">
                                <div class="ai-input-footer-left">
                                    <label class="ai-attach-btn" for="aiImageInput" title="上传图片">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                                        </svg>
                                    </label>
                                    <input type="file" id="aiImageInput" accept="image/*" multiple style="display: none;">
                                    <button class="ai-thinking-chip" id="aiThinkingBtn" title="思考模式（开启后 AI 会进行深度推理）">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M12 2a7 7 0 0 1 5.29 11.56l-.29.28V17a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-3.16l-.29-.28A7 7 0 0 1 12 2z"></path>
                                            <line x1="9" y1="21" x2="15" y2="21"></line>
                                            <line x1="10" y1="23" x2="14" y2="23"></line>
                                        </svg>
                                        <span>思考</span>
                                    </button>
                                </div>
                                <button class="ai-send-btn" id="aiChatSendBtn" disabled>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="12" y1="19" x2="12" y2="5"></line>
                                        <polyline points="5 12 12 5 19 12"></polyline>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>

            <!-- 结果页面 -->
            <div class="result-container" id="result-container">
                <div class="result-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
                </div>
                <div class="result-title">答题完成！</div>
                <div class="result-score" id="result-score">0</div>
                <div class="result-total">总分 <span id="total-score">0</span> 分</div>

                <!-- 有主观题时的统计 -->
                <div class="result-stats" id="has-subjective" style="display: none;">
                    <div class="stat-item">
                        <div class="stat-value" id="objective-correct">0</div>
                        <div class="stat-label">客观题答对</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value"><span id="objective-total">0</span> 题</div>
                        <div class="stat-label">客观题总数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="objective-accuracy">0%</div>
                        <div class="stat-label">客观题正确率</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="subjective-score">0%</div>
                        <div class="stat-label">主观题平均得分率</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value"><span id="subjective-total">0</span> 题</div>
                        <div class="stat-label">主观题总数</div>
                    </div>
                </div>

                <!-- 没有主观题时的统计 -->
                <div class="result-stats" id="no-subjective" style="display: none;">
                    <div class="stat-item">
                        <div class="stat-value" id="objective-correct-2">0</div>
                        <div class="stat-label">答对题数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value"><span id="objective-total-2">0</span> 题</div>
                        <div class="stat-label">题目总数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="objective-accuracy-2">0%</div>
                        <div class="stat-label">正确率</div>
                    </div>
                </div>

                <div class="result-buttons">
                    <button class="btn btn-submit" id="review-btn">查看详情</button>
                    <button class="btn btn-secondary" id="restart-result-btn">重新开始</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 移动端遮罩层 -->
    <div class="mobile-overlay" id="mobile-overlay"></div>

    <script type="module" src="js/exam.js?v=20260823b"></script>
</body>
</html>
