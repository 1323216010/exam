<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Embed</title>
    <!-- Vditor for Markdown rendering (same as markdown_viewer) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.7/dist/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vditor@3.10.7/dist/index.min.js"></script>
    <!-- PDF 转换模块 -->
    <script type="module">
        import { convertPdfToBase64Images } from './pdfConverter.js';
        window.convertPdfToBase64Images = convertPdfToBase64Images;
    </script>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="chat_embed.css?v=20260122a1">
</head>
<body>
    <div class="chat-messages" id="chatMessages">
        <div class="message assistant">
            <div class="message-content">你好！我是 Kangaroo AI 助手。有什么我可以帮助你的吗？</div>
        </div>
    </div>
    <div class="error-message" id="errorMessage"></div>
    <div id="contextCard"></div>
    <div class="chat-input-area">
        <div id="imagePreviewContainer" class="image-preview-container" style="display: none;"></div>
        <div class="input-box">
            <textarea 
                class="chat-input" 
                id="chatInput" 
                placeholder="Enter 发送 | 拖放图片、PDF 或 PPT"
                onkeydown="handleKeyDown(event)"
                rows="1"
            ></textarea>
            <div class="input-footer">
                <div class="input-footer-left">
                    <label class="attach-btn" for="imageInput" title="上传图片/PDF">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </label>
                    <input type="file" id="imageInput" accept="image/*,application/pdf,.ppt,.pptx" multiple style="display: none;" onchange="handleImageSelect(event)">
                    <button class="thinking-chip" id="thinkingBtn" title="思考模式（Chain of Thought）" onclick="toggleThinking()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2a7 7 0 0 1 5.29 11.56l-.29.28V17a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-3.16l-.29-.28A7 7 0 0 1 12 2z"></path>
                            <line x1="9" y1="21" x2="15" y2="21"></line>
                            <line x1="10" y1="23" x2="14" y2="23"></line>
                        </svg>
                        <span>思考</span>
                    </button>
                </div>
                <button class="send-button" id="sendButton" onclick="sendMessage()" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 自定义脚本 -->
    <script src="chat_embed.js?v=20260122a1"></script>
</body>
</html>
